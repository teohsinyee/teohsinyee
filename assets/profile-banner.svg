  <text x="356" y="150" fill="#112033" font-size="42" font-family="Georgia, 'Times New Roman', serif" font-weight="700">I keep the complexity.</text>
  <text x="356" y="200" fill="#112033" font-size="42" font-family="Georgia, 'Times New Roman', serif" font-weight="700">You get the clarity.</text>

