  <text x="84" y="189" fill="#112033" font-size="22" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" letter-spacing="1.2">REVIEW</text>
  <text x="84" y="255" fill="#F5EFE5" font-size="18" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" letter-spacing="1.4">HANDOVER READY</text>
